<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6a5b" />
  <meta name="description" content="사진과 위치로 좋은 장소를 기억하고 컬렉션으로 공유하는 앱" />
  <title>여기였지</title>
  <link rel="manifest" href="manifest.json" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="map-polish.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow" id="headerEyebrow">기억해 둔 장소 4곳</p>
        <h1 id="headerTitle">내 지도</h1>
        <small class="storage-status" id="storageStatus">저장 방식 확인 중…</small>
      </div>
      <button class="icon-button" id="profileButton" aria-label="설정">⚙</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button data-tab="map" class="nav-item active"><span>⌖</span><small>지도</small></button>
      <button data-tab="memories" class="nav-item"><span>▧</span><small>기억</small></button>
      <button data-tab="add" class="nav-item add"><span>＋</span><small>저장</small></button>
      <button data-tab="collections" class="nav-item"><span>▣</span><small>컬렉션</small></button>
    </nav>
  </div>

  <dialog id="detailDialog" class="dialog"></dialog>
  <dialog id="settingsDialog" class="dialog compact"></dialog>
  <dialog id="collectionDialog" class="dialog compact">
    <form id="collectionForm">
      <h2>새 컬렉션</h2>
      <p class="meta">장소를 모아 볼 컬렉션을 만드세요.</p>
      <label class="field"><span>컬렉션 이름</span><input id="collectionName" maxlength="60" autocomplete="off" required /></label>
      <fieldset class="privacy collection-privacy"><legend>공개 범위</legend><label><input name="collectionPrivacy" type="radio" value="private" checked /> 🔒 나만 보기</label><label><input name="collectionPrivacy" type="radio" value="link" /> 🔗 링크 공유</label></fieldset>
      <p id="collectionError" class="form-error" role="alert"></p>
      <div class="dialog-form-actions"><button class="secondary" id="cancelCollectionButton" type="button">취소</button><button class="primary" id="createCollectionButton" type="submit">만들기</button></div>
    </form>
  </dialog>

  <template id="mapViewTemplate">
    <section class="map-view">
      <label class="search-box"><span>⌕</span><input id="mapSearch" placeholder="장소, 메모, 태그 검색" /></label>
      <div class="chips" id="mapChips"></div>
      <div class="map-stage">
        <div class="real-map" id="realMap" aria-label="저장한 장소 지도"></div>
        <div class="map-toolbar">
          <button class="location-button compact-button" type="button" id="locateMapButton">⌖ 내 위치</button>
          <span id="mapStatus">지도를 누르면 새 장소 위치를 선택할 수 있습니다.</span>
        </div>
        <div class="map-location-panel" id="mapLocationPanel" hidden>
          <div><b>선택한 위치</b><small id="mapLocationText"></small></div>
          <button class="primary compact-button" type="button" id="saveMapLocationButton">이 위치 저장</button>
        </div>
        <div class="map-selected-overlay" id="mapSelectedCard"></div>
      </div>
    </section>
  </template>

  <template id="memoriesViewTemplate">
    <section>
      <div class="chips"><button class="chip active">최신순</button><button class="chip">지역</button><button class="chip">태그</button><button class="chip">날짜</button></div>
      <div id="memoryList" class="memory-list"></div>
    </section>
  </template>

  <template id="addViewTemplate">
    <section class="add-view">
      <form id="placeForm">
        <div class="step-indicator"><span class="active"></span><span class="active"></span><span></span></div>
        <div class="upload-card" id="uploadCard">
          <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
          <div id="photoPreview" class="photo-preview"><b>＋</b><strong>사진 촬영 또는 앨범에서 선택</strong><small>장소를 기억할 사진을 선택하세요</small></div>
          <button class="secondary full" type="button" id="photoButton">사진 선택</button>
        </div>
        <label class="field"><span>장소 이름</span><input id="placeName" required maxlength="100" placeholder="예: 강릉 바다 창가 카페" /></label>
        <div class="field inline-field"><label><span>위도</span><input id="latitude" inputmode="decimal" placeholder="37.5665" /></label><label><span>경도</span><input id="longitude" inputmode="decimal" placeholder="126.9780" /></label></div>
        <button class="location-button" type="button" id="locationButton">⌖ 현재 위치 불러오기</button>
        <div class="location-picker-wrap">
          <div id="locationPickerMap" class="location-picker-map" aria-label="장소 위치 선택 지도"></div>
          <small>지도를 움직인 뒤 원하는 지점을 누르면 위도와 경도가 입력됩니다.</small>
        </div>
        <label class="field"><span>한 줄 메모</span><textarea id="memo" rows="3" maxlength="500" placeholder="무엇이 좋았는지 기록하세요"></textarea></label>
        <label class="field"><span>카테고리</span><select id="category"><option>카페</option><option>맛집</option><option>숙소</option><option>볼거리</option><option>쇼핑</option><option>기타</option></select></label>
        <label class="field"><span>태그</span><input id="tags" maxlength="200" placeholder="바다전망, 다시갈곳" /></label>
        <label class="field"><span>컬렉션</span><select id="collectionSelect"></select></label>
        <fieldset class="privacy"><legend>공개 범위</legend><label><input name="privacy" type="radio" value="private" checked /> 🔒 나만 보기</label><label><input name="privacy" type="radio" value="link" /> 🔗 링크 공유</label></fieldset>
        <button class="primary full" type="submit">장소 저장하기</button>
      </form>
    </section>
  </template>

  <template id="collectionsViewTemplate">
    <section><div class="section-heading"><p>장소를 주제별로 정리하세요</p><button id="newCollectionButton" class="icon-button primary-icon" type="button" aria-label="새 컬렉션 만들기">＋</button></div><div id="collectionList" class="collection-list"></div></section>
  </template>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-auth.js"></script>
  <script src="data-store.js"></script>
  <script src="auth-controller.js"></script>
  <script src="app.js"></script>
</body>
</html>
